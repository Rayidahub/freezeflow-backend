services:
  - type: web
    name: freezeflow-ops-api
    env: node
    region: oregon
    plan: free
    # Build: compile TS + generate Prisma client + run migrations
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: freezeflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        # Replace with your actual Vercel frontend URL after deployment
        value: https://freezeflow-ops.vercel.app

databases:
  - name: freezeflow-db
    plan: free
    region: oregon
    databaseName: freezeflow
    user: freezeflow_user
